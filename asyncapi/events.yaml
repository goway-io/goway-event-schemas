    x-publisher: goway-loads
    x-consumers: [goway-realtime]
  bookingCompleted:
    address: booking.completed
    description: A delivered haul was closed; billing charges its commission from it.
    messages:
      bookingCompleted:
        $ref: '#/components/messages/bookingCompleted'
    x-publisher: goway-loads
    x-consumers: [goway-auth, goway-billing, goway-notify, goway-realtime]
  bookingCancelled:
    address: booking.cancelled
    description: A booking ended before loading. The load returns to the board in the same transaction.
    messages:
      bookingCancelled:
        $ref: '#/components/messages/bookingCancelled'
    x-publisher: goway-loads
    x-consumers: [goway-notify, goway-realtime]
  bookingAmountClaimed:
    address: booking.amount_claimed
    description: One side says a delivered haul settled at another sum.
    messages:
      bookingAmountClaimed:
        $ref: '#/components/messages/bookingAmountClaimed'
    x-publisher: goway-loads
    x-consumers: []
  bookingAmountSettled:
    address: booking.amount_settled
    description: An operator accepted an amount claim.
    messages:
      bookingAmountSettled:
        $ref: '#/components/messages/bookingAmountSettled'
    x-publisher: goway-loads
    x-consumers: [goway-billing, goway-notify]
  bookingReturnLoads:
    address: booking.return_loads
