      supportTicketReplied:
        $ref: '#/components/messages/supportTicketReplied'
    x-publisher: goway-auth
    x-consumers: [goway-notify]
  driverStatsChanged:
    address: driver.stats_changed
    description: A driver's completed-haul count or rating changed.
    messages:
      driverStatsChanged:
        $ref: '#/components/messages/driverStatsChanged'
    x-publisher: goway-auth
    x-consumers: [goway-loads]
  loadPosted:
    address: load.posted
    description: 'A load is open on the board: newly posted, or back after a cancelled booking.'
    messages:
      loadPosted:
        $ref: '#/components/messages/loadPosted'
    x-publisher: goway-loads
    x-consumers: [goway-realtime]
  loadCancelled:
