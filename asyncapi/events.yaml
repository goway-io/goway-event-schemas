operations:
  publishUserCreated:
    action: send
    channel:
      $ref: '#/channels/userCreated'
    description: Published by self-signup, an admin create (with `first_name`, `last_name`) and an admin restore (with `updated_at`); `membership.created` follows with the side.
  publishUserUpdated:
    action: send
    channel:
      $ref: '#/channels/userUpdated'
    description: Published by a confirmed phone change, the account settings screen, an admin edit and a profile edit, each with its own field set.
  publishUserDeleted:
    action: send
    channel:
      $ref: '#/channels/userDeleted'
    description: Published when the owner deletes the account, and on an admin soft or hard delete (with `updated_at`).
  publishMembershipCreated:
    action: send
    channel:
      $ref: '#/channels/membershipCreated'
    description: Published when an account opens (self-signup, admin create) and when a deleted account is restored.
  publishMembershipUpdated:
    action: send
    channel:
      $ref: '#/channels/membershipUpdated'
    description: Published when a membership's role changes within its side, or its organization changes account type.
  publishMembershipRemoved:
    action: send
    channel:
      $ref: '#/channels/membershipRemoved'
    description: Published when the owner deletes the account and on an admin soft or hard delete.
  publishUserLogin:
    action: send
    channel:
      $ref: '#/channels/userLogin'
    description: 'Published on every issued session: code, password, password reset, phone change.'
  publishUserSessionRevoked:
    action: send
    channel:
      $ref: '#/channels/userSessionRevoked'
    description: Published after a password change or reset, a phone change, an account delete and an admin block.
  publishUserBlocked:
    action: send
    channel:
      $ref: '#/channels/userBlocked'
    description: Published when an operator blocks an account, after its sessions are closed.
  publishUserUnblocked:
    action: send
    channel:
      $ref: '#/channels/userUnblocked'
    description: Published when an operator lifts a block.
  publishUserSessionsClosed:
    action: send
    channel:
      $ref: '#/channels/userSessionsClosed'
    description: Published when a user closes one or all other sessions and at least one install is affected.
  publishDeviceUpserted:
    action: send
    channel:
      $ref: '#/channels/deviceUpserted'
    description: Published on a new device, a restored device, a changed push registration or notification permission, and on sign-out, which clears the token.
  publishDeviceRemoved:
    action: send
    channel:
      $ref: '#/channels/deviceRemoved'
    description: Published when the owner removes a device from the account.
  publishOrgUpdated:
    action: send
    channel:
      $ref: '#/channels/orgUpdated'
    description: Published by a role switch (`kind`, `account_type`) and by the organization screen (company details).
  publishVehicleUpserted:
    action: send
    channel:
      $ref: '#/channels/vehicleUpserted'
    description: Published when a vehicle is added and whenever one of its fields changes.
  publishVehicleRemoved:
    action: send
    channel:
      $ref: '#/channels/vehicleRemoved'
    description: Published when a carrier removes a vehicle.
  publishCarrierDocumentUpdated:
    action: send
    channel:
      $ref: '#/channels/carrierDocumentUpdated'
    description: Published when a carrier uploads a document; it waits for review.
  publishCarrierDocumentReviewed:
    action: send
    channel:
      $ref: '#/channels/carrierDocumentReviewed'
    description: Published on an operator's document decision.
  publishCarrierDocumentExpired:
    action: send
    channel:
      $ref: '#/channels/carrierDocumentExpired'
    description: Published by the hourly document sweep.
  publishCarrierDocumentExpiring:
    action: send
    channel:
      $ref: '#/channels/carrierDocumentExpiring'
    description: Published by the hourly document sweep, once per document.
  publishCarrierLineChanged:
    action: send
    channel:
      $ref: '#/channels/carrierLineChanged'
    description: Published when a driver saves a line, and when the line's truck is removed.
  publishCarrierVerificationChanged:
    action: send
    channel:
      $ref: '#/channels/carrierVerificationChanged'
    description: Published when a carrier submits for verification, when a replaced document reopens it, and on an operator's decision.
  publishCarrierVehicleReviewed:
    action: send
    channel:
      $ref: '#/channels/carrierVehicleReviewed'
    description: Published whenever a truck's review status changes.
  publishSupportTicketCreated:
    action: send
    channel:
      $ref: '#/channels/supportTicketCreated'
    description: Published when a ticket is opened.
  publishSupportTicketReplied:
    action: send
    channel:
      $ref: '#/channels/supportTicketReplied'
    description: Published when an admin replies to a ticket.
  publishDriverStatsChanged:
    action: send
    channel:
      $ref: '#/channels/driverStatsChanged'
    description: Published after a completed haul or a new rating is counted.
  publishLoadPosted:
    action: send
    channel:
      $ref: '#/channels/loadPosted'
    description: 'Published once per truck of a new post, and again with `reposted: true` when a booking is cancelled.'
  publishLoadCancelled:
    action: send
    channel:
      $ref: '#/channels/loadCancelled'
    description: Published when the shipper cancels a load that is not booked.
  publishLoadExpired:
    action: send
    channel:
      $ref: '#/channels/loadExpired'
    description: Published by the expiry sweep, every five minutes.
  publishOfferCreated:
    action: send
    channel:
      $ref: '#/channels/offerCreated'
    description: Published on a carrier request and on every counter-offer.
  publishOfferAccepted:
    action: send
    channel:
      $ref: '#/channels/offerAccepted'
    description: Published with `booking.created` when either side accepts an offer.
  publishBookingCreated:
    action: send
    channel:
      $ref: '#/channels/bookingCreated'
    description: 'Published on an accepted offer and on an instant claim from dispatch (with `source: instant`).'
  publishBookingStatusChanged:
    action: send
    channel:
      $ref: '#/channels/bookingStatusChanged'
    description: Published at every carrier step from `confirmed` to `delivered`.
  publishBookingEtaUpdated:
    action: send
    channel:
      $ref: '#/channels/bookingEtaUpdated'
    description: Published at booking, at every carrier step, and on fresh GPS while the truck is moving.
  publishBookingCompleted:
    action: send
    channel:
      $ref: '#/channels/bookingCompleted'
    description: Published when the shipper confirms, an operator completes, or the auto-complete sweep closes the haul.
  publishBookingCancelled:
    action: send
    channel:
      $ref: '#/channels/bookingCancelled'
    description: Published when either side or an operator cancels a booking.
  publishBookingAmountClaimed:
    action: send
    channel:
      $ref: '#/channels/bookingAmountClaimed'
    description: Published when a shipper or carrier claims another sum.
  publishBookingAmountSettled:
    action: send
    channel:
      $ref: '#/channels/bookingAmountSettled'
    description: Published when an operator accepts a claim; a rejected claim publishes nothing.
  publishBookingReturnLoads:
    action: send
    channel:
      $ref: '#/channels/bookingReturnLoads'
    description: Published by the return-offer sweep, every ten minutes, once per haul.
  publishRatingCreated:
    action: send
    channel:
      $ref: '#/channels/ratingCreated'
    description: Published once per haul when the shipper rates it.
  publishWalletEntryPosted:
    action: send
    channel:
      $ref: '#/channels/walletEntryPosted'
    description: 'Published for every new ledger line: commissions, cash, adjustments, subscriptions, promos, referrals and bonus moves.'
  publishWalletEligibilityChanged:
    action: send
    channel:
      $ref: '#/channels/walletEligibilityChanged'
    description: Published once per user of the organization whenever the wallet's eligibility flips, or once with a null `user_id` when billing knows no user of it.
  publishWalletToppedUp:
    action: send
    channel:
      $ref: '#/channels/walletToppedUp'
    description: Published when an operator records a cash payment.
  publishNotificationCreated:
    action: send
    channel:
      $ref: '#/channels/notificationCreated'
    description: 'Published for every feed row: from an event''s delivery plan, or from an admin announcement.'
  publishDevicePushFailed:
    action: send
    channel:
      $ref: '#/channels/devicePushFailed'
    description: Published when a push comes back with a dead-token answer.
  publishRegionChanged:
    action: send
    channel:
      $ref: '#/channels/regionChanged'
    description: Published when an admin sets a region's active flag.
  publishMarketLaneRatesPublished:
    action: send
    channel:
      $ref: '#/channels/marketLaneRatesPublished'
    description: Published when a snapshot moves a price or a curve past the change threshold, and at least daily.
  publishInterestOpened:
    action: send
    channel:
      $ref: '#/channels/interestOpened'
    description: Published when an operator opens a coming service or geo opens a region, once per 500 voters.
  publishSettingsChanged:
    action: send
    channel:
      $ref: '#/channels/settingsChanged'
    description: Published by goway-lib in every Python service with runtime settings, and by goway-realtime, on change or reset.
  publishDriverOnline:
    action: send
    channel:
      $ref: '#/channels/driverOnline'
    description: Published on every accepted `go_online` frame.
  publishDriverOffline:
    action: send
    channel:
      $ref: '#/channels/driverOffline'
    description: Published on `go_offline`, line expiry, the end of the disconnect grace, and session revocation.
  publishLocationSampled:
    action: send
    channel:
      $ref: '#/channels/locationSampled'
    description: Published at most every `location_sample_seconds` while the driver has an active booking.
  publishDispatchOffered:
    action: send
    channel:
      $ref: '#/channels/dispatchOffered'
    description: Published after every offer wave that reached at least one driver.
  publishLoadUpdated:
    action: send
    channel:
      $ref: '#/channels/loadUpdated'
    description: Published when the shipper or an operator edits a posted load.
  publishOfferResolved:
    action: send
    channel:
      $ref: '#/channels/offerResolved'
    description: Published once per driver per offer when its outcome is known.
  publishDispatchExhausted:
    action: send
    channel:
      $ref: '#/channels/dispatchExhausted'
    description: Published once per search window that ends without a taker; the search itself goes on.
  publishDriverOfferFilterChanged:
    action: send
    channel:
      $ref: '#/channels/driverOfferFilterChanged'
    description: Published when a driver saves their offer filter.
  publishBookingPlanDue:
    action: send
    channel:
      $ref: '#/channels/bookingPlanDue'
    description: "Published by the loads worker once per stage per booking: reminder, departure and overdue."
  publishLoadPlanUnclaimed:
    action: send
    channel:
      $ref: '#/channels/loadPlanUnclaimed'
    description: Published by the loads worker once per load.
  publishBookingWaitingStarted:
    action: send
    channel:
      $ref: '#/channels/bookingWaitingStarted'
    description: "Published by the loads worker once per booking."
  publishBookingIssueOpened:
    action: send
    channel:
      $ref: '#/channels/bookingIssueOpened'
    description: "Published when the driver or the shipper reports a problem."
  publishBookingIssueResolved:
    action: send
    channel:
      $ref: '#/channels/bookingIssueResolved'
    description: "Published when an operator decides on an open issue."
  publishShipperStatsChanged:
    action: send
    channel:
      $ref: '#/channels/shipperStatsChanged'
    description: "Published when a driver's rating of a shipper is counted."
  publishBookingObjectionOpened:
    action: send
    channel:
      $ref: '#/channels/bookingObjectionOpened'
    description: "Published when the shipper objects within the objection window."
  publishBookingObjectionResolved:
    action: send
    channel:
      $ref: '#/channels/bookingObjectionResolved'
    description: "Published when an operator accepts or rejects an objection."
  publishChatMessageCreated:
    action: send
    channel:
      $ref: '#/channels/chatMessageCreated'
    description: "Published when the driver or the shipper sends a chat message."
  publishChatRead:
    action: send
    channel:
      $ref: '#/channels/chatRead'
    description: "Published when a party marks the chat read."
  publishSupportMessageCreated:
    action: send
    channel:
      $ref: '#/channels/supportMessageCreated'
    description: "Published when the person or an operator writes in a support conversation."
  publishWalletLowBalance:
    action: send
    channel:
      $ref: '#/channels/walletLowBalance'
    description: "Published once when the headroom falls below `low_balance_warning`."
