      - $ref: '#/channels/socket/messages/driverLocation'
      - $ref: '#/channels/socket/messages/lineExpiring'
      - $ref: '#/channels/socket/messages/lineExpired'
      - $ref: '#/channels/socket/messages/offersBlocked'
      - $ref: '#/channels/socket/messages/offersUnblocked'
      - $ref: '#/channels/socket/messages/notification'
      - $ref: '#/channels/socket/messages/sessionStarted'
      - $ref: '#/channels/socket/messages/kicked'
      - $ref: '#/channels/socket/messages/error'
