      offline:
        $ref: '#/components/messages/offline'
      offerProposed:
        $ref: '#/components/messages/offerProposed'
      offerResult:
        $ref: '#/components/messages/offerResult'
      subscribed:
        $ref: '#/components/messages/subscribed'
      bookingCreated:
        $ref: '#/components/messages/bookingCreated'
      bookingStatus:
        $ref: '#/components/messages/bookingStatus'
      bookingEta:
        $ref: '#/components/messages/bookingEta'
      bookingCompleted:
        $ref: '#/components/messages/bookingCompleted'
      bookingCancelled:
        $ref: '#/components/messages/bookingCancelled'
      driverLocation:
        $ref: '#/components/messages/driverLocation'
      verificationChanged:
        $ref: '#/components/messages/verificationChanged'
      offersBlocked:
        $ref: '#/components/messages/offersBlocked'
      offersUnblocked:
        $ref: '#/components/messages/offersUnblocked'
      searchProgress:
        $ref: '#/components/messages/searchProgress'
      searchExhausted:
