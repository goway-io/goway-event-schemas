asyncapi: 3.1.0
info:
  title: GoWay realtime socket
  version: 0.1.0
  description: |
    The WebSocket between goway-realtime and the driver and client apps, described from the server's side:
    frames the apps send are `receive`, frames the server sends are `send`.

    Every frame is a JSON object `{"type", "data"}`; frames from the server also carry `ts`, and `ping` and
    `go_offline` may leave `data` out. The first frame after connecting must be `auth` within five seconds. The
    socket is a wake-up signal: after a reconnect the app re-reads state over REST, because frames sent while it was
    away are not replayed.
defaultContentType: application/json
servers:
  production:
    host: api.goroute.uz
    pathname: /realtime
    protocol: wss
    description: Public entry; the proxy forwards `/realtime/v1/ws` to goway-realtime.
channels:
  socket:
    address: /v1/ws
    title: App socket
    description: One socket per signed-in app session.
    messages:
      auth:
        $ref: '#/components/messages/auth'
      ping:
        $ref: '#/components/messages/ping'
      goOnline:
        $ref: '#/components/messages/goOnline'
      goOffline:
        $ref: '#/components/messages/goOffline'
      location:
        $ref: '#/components/messages/location'
      offerResponse:
        $ref: '#/components/messages/offerResponse'
      subscribeBooking:
        $ref: '#/components/messages/subscribeBooking'
      unsubscribeBooking:
        $ref: '#/components/messages/unsubscribeBooking'
      connected:
        $ref: '#/components/messages/connected'
      pong:
        $ref: '#/components/messages/pong'
      online:
        $ref: '#/components/messages/online'
      offline:
        $ref: '#/components/messages/offline'
      offerProposed:
        $ref: '#/components/messages/offerProposed'
      offerResult:
        $ref: '#/components/messages/offerResult'
      subscribed:
        $ref: '#/components/messages/subscribed'
      bookingCreated:
        $ref: '#/components/messages/bookingCreated'
      bookingStatus:
        $ref: '#/components/messages/bookingStatus'
      bookingEta:
        $ref: '#/components/messages/bookingEta'
      bookingCompleted:
        $ref: '#/components/messages/bookingCompleted'
      bookingCancelled:
        $ref: '#/components/messages/bookingCancelled'
      driverLocation:
        $ref: '#/components/messages/driverLocation'
      lineExpiring:
        $ref: '#/components/messages/lineExpiring'
      lineExpired:
        $ref: '#/components/messages/lineExpired'
      offersBlocked:
        $ref: '#/components/messages/offersBlocked'
      offersUnblocked:
        $ref: '#/components/messages/offersUnblocked'
      notification:
        $ref: '#/components/messages/notification'
      sessionStarted:
        $ref: '#/components/messages/sessionStarted'
      kicked:
        $ref: '#/components/messages/kicked'
      error:
        $ref: '#/components/messages/error'
    bindings:
      ws:
        method: GET
        bindingVersion: 0.1.0
operations:
  receiveFromApp:
    title: From the app
    action: receive
    channel:
      $ref: '#/channels/socket'
    description: Frames an app sends.
    messages:
      - $ref: '#/channels/socket/messages/auth'
      - $ref: '#/channels/socket/messages/ping'
      - $ref: '#/channels/socket/messages/goOnline'
      - $ref: '#/channels/socket/messages/goOffline'
      - $ref: '#/channels/socket/messages/location'
      - $ref: '#/channels/socket/messages/offerResponse'
      - $ref: '#/channels/socket/messages/subscribeBooking'
      - $ref: '#/channels/socket/messages/unsubscribeBooking'
  sendToApp:
    title: To the app
    action: send
    channel:
      $ref: '#/channels/socket'
    description: Frames goway-realtime sends.
    messages:
      - $ref: '#/channels/socket/messages/connected'
      - $ref: '#/channels/socket/messages/pong'
      - $ref: '#/channels/socket/messages/online'
      - $ref: '#/channels/socket/messages/offline'
      - $ref: '#/channels/socket/messages/offerProposed'
