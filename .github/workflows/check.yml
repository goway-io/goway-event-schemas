name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@v10.3.0
      - run: rustup toolchain install 1.98.0 --profile minimal -c rustfmt,clippy && rustup default 1.98.0
      - uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: 3.13.4
      - uses: actions/cache@v6
        with:
          path: |
            .tools
            ~/.cargo/registry
            packages/rust/target
          key: tools-${{ runner.os }}-${{ hashFiles('packages/rust/Cargo.lock', 'Makefile') }}
      - run: make tools
      - run: make check
      - run: make breaking
      - run: make drift
      - run: make test
      - run: make docs
