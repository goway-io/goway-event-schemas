[package]
name = "goway-events"
version = "0.1.0"
edition = "2024"
description = "Typed GoWay NATS events and WebSocket frames, generated from goway-event-schemas."
publish = false

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["serde"] }

[dev-dependencies]
jsonschema = "0.58.6"
