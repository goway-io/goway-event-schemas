[project]
name = "goway-events"
version = "0.1.0"
description = "Typed GoWay NATS events and WebSocket frames, with schema checks for producers."
readme = "README.md"
authors = [
    { name = "Asliddin", email = "asliddinabdumannonov06@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jsonschema[format]>=4.26.0",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "datamodel-code-generator==0.87.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["src/goway_events/models.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
